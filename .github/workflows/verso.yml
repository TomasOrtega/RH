name: Deploy Verso

on:
  push:
    branches: [verso]
    paths:
      - verso/**
      - .github/workflows/verso.yml

permissions:
  contents: read

concurrency:
  group: verso-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verso
          auto-config: 'false'
          build: 'false'
          test: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Build Verso page
        working-directory: verso
        run: |
          lake build VersoManual
          lake env lean --run Render.lean
      - name: Pack proof archive
        run: |
          python3 -B -m unittest discover -s verso -p 'test_citations.py'
          python3 -B verso/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: verso/_out/html-single

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
